<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Attribute-Aware Product Retrieval
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/custom.css') }}">

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <!-- Header -->
    <header class="app-header">

        <div class="header-inner">

            <a href="{{ url_for('choice') }}"
               class="brand">

                <div class="brand-title">
                    Attribute-Aware Product Retrieval
                </div>

                <div class="brand-subtitle">
                    Composed Image Retrieval for Fine-Grained Product Search
                </div>

            </a>

            <nav class="main-nav">

                <a href="{{ url_for('choice') }}"
                   class="nav-link">
                    Search
                </a>

            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="app-footer">

        <div>
            Deep Learning Research Prototype
        </div>

        <div>
            Image + Text → Product Retrieval
        </div>

    </footer>


    {% block scripts %}
    {% endblock %}

</body>

</html>
